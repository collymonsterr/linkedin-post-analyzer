<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>Right-click each image and "Save image as..." to save the icons.</p>
<div id="output" style="display:flex;gap:20px;flex-wrap:wrap;"></div>
<script>
var sizes = [16, 32, 48, 128];
sizes.forEach(function(size) {
  var c = document.createElement('canvas');
  c.width = size; c.height = size;
  var ctx = c.getContext('2d');

  // Background - rounded rect with LinkedIn blue gradient
  var r = size * 0.18;
  var grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#0a66c2');
  grad.addColorStop(1, '#1e40af');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.fill();

  // Chart bars
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  var barW = size * 0.12;
  var gap = size * 0.06;
  var baseY = size * 0.78;
  var startX = size * 0.15;
  var heights = [0.20, 0.35, 0.55, 0.42, 0.30];
  heights.forEach(function(h, i) {
    var x = startX + i * (barW + gap);
    var bh = size * h;
    ctx.fillRect(x, baseY - bh, barW, bh);
  });

  // Upward trend line
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = Math.max(1.5, size * 0.04);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  var points = [
    [size * 0.18, size * 0.65],
    [size * 0.35, size * 0.50],
    [size * 0.50, size * 0.35],
    [size * 0.65, size * 0.28],
    [size * 0.82, size * 0.18]
  ];
  ctx.moveTo(points[0][0], points[0][1]);
  for (var i = 1; i < points.length; i++) {
    ctx.lineTo(points[i][0], points[i][1]);
  }
  ctx.stroke();

  // Arrow head on trend line
  var last = points[points.length - 1];
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  var as = Math.max(3, size * 0.08);
  ctx.moveTo(last[0] + as * 0.3, last[1] - as);
  ctx.lineTo(last[0] + as, last[1] + as * 0.3);
  ctx.lineTo(last[0] - as * 0.5, last[1] + as * 0.2);
  ctx.fill();

  // Display
  var div = document.createElement('div');
  div.style.textAlign = 'center';
  var img = new Image();
  img.src = c.toDataURL('image/png');
  img.style.width = Math.max(size, 48) + 'px';
  img.style.imageRendering = 'pixelated';
  div.appendChild(img);
  div.innerHTML += '<br><strong>' + size + 'x' + size + '</strong>';

  // Auto-download link
  var a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = 'icon' + size + '.png';
  a.textContent = ' Download';
  a.style.fontSize = '12px';
  div.appendChild(a);

  document.getElementById('output').appendChild(div);
});
</script>
</body>
</html>
